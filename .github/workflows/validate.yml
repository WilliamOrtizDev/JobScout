name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Repository safety validation
        run: python3 scripts/validate.py
      - name: Portable clean-home install smoke test
        run: bash scripts/smoke_portable_install.sh
